name: Deploy CF Pages Lexicon
on:
  push:
    branches: [main]
    paths:
      - 'cf-lexicon/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ vars.CLOUDFLARE_API_TOKEN }}
          accountId: a6ab1e84880a13c5ca58e81f15767b4f
          command: pages deploy cf-lexicon --project-name=workload-tab-lexicon --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
